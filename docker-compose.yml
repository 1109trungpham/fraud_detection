version: '3.8'

services:

  # ===========================================================
  # PostgreSQL (transaction database)
  # ===========================================================
  postgres:
    image: postgres:16
    container_name: banking_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: banking
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    volumes:
      - banking_pg_data:/var/lib/postgresql/data

  # ===========================================================
  # Kafka in KRaft mode (NO ZOOKEEPER)
  # ===========================================================
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 'bankingCluster123456789'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # INTERNAL = cho container
      # EXTERNAL = cho localhost
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ===========================================================
  # Debezium Kafka Connect
  # ===========================================================
  connect:
    image: debezium/connect:2.6
    container_name: connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9094
      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

    depends_on:
      - kafka
      - postgres

  # ===========================================================
  # MinIO (Data Lake)
  # ===========================================================
  # minio:
  #   image: minio/minio:latest
  #   container_name: minio
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - "9000:9000"  # S3 API
  #     - "9001:9001"  # MinIO console
  #   environment:
  #     MINIO_ROOT_USER: admin
  #     MINIO_ROOT_PASSWORD: adminadmin
  #   volumes:
  #     - minio_data:/data

  # ===========================================================
  # Spark (for streaming job)
  # ===========================================================
  spark:
    build:
      context: ./spark
    container_name: spark
    environment:
      SPARK_MODE: master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./jars/postgresql.jar:/opt/spark/jars/postgresql.jar
      - ./lake/raw/transactions:/lake/raw/transactions
      - ./checkpoints/tx_clean_lake:/opt/spark/checkpoints/tx_clean_lake
      - ./checkpoints/tx_clean_kafka:/opt/spark/checkpoints/tx_clean_kafka
      - ./checkpoints/account_dim:/opt/spark/checkpoints/account_dim
      - ./checkpoints/account_dim_v2:/opt/spark/checkpoints/account_dim_v2
      - ./checkpoints/customer_dim:/opt/spark/checkpoints/customer_dim
      - ./checkpoints/customer_dim_v2:/opt/spark/checkpoints/customer_dim_v2
      - ./checkpoints/tx_enriched:/opt/spark/checkpoints/tx_enriched
      - ./checkpoints/tx_enriched_redis:/opt/spark/checkpoints/tx_enriched_redis

    depends_on:
      - kafka
      # - minio

  # ===========================================================
  # Redis (Hot Storage for Enrichment)
  # ===========================================================
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes  # Bật AOF để không mất dữ liệu khi restart
    volumes:
      - redis_data:/data

  # ===========================================================
  # Redis Insight (Giao diện quản lý Redis - Tùy chọn)
  # ===========================================================
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "8001:8001"
    depends_on:
      - redis

volumes:
  banking_pg_data:
  kafka_data:
  # minio_data:
  redis_data: